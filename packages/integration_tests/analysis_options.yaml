include: package:very_good_analysis/analysis_options.yaml
analyzer:
  # `source/` is generator input — the analyzer resolves
  # `package:integration_tests/...` imports to the generated `lib/` types,
  # so cross-file source files appear as type errors against `Signal<T>`
  # / `ListSignal<T>` (which the generator rewrites in lib/). Exclude the
  # directory to keep the IDE focused on the actual runnable output.
  exclude:
    - source/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    must_be_immutable: ignore
    always_put_required_named_parameters_first: ignore
    invalid_annotation_target: ignore
    specify_nonobvious_property_types: ignore
    # Newer SDKs mark `NavigatorState.push` `@awaitNotRequired`, flagging the
    # `unawaited(...)` wraps as unnecessary; older SDKs lack the annotation
    # and require them via `unawaited_futures`. Suppress so the explicit
    # `unawaited(...)` intent stays valid on both.
    unnecessary_unawaited: ignore
linter:
  rules:
    public_member_api_docs: false
    # `source/` uses relative imports for same-package siblings, and the
    # generator mirrors those paths 1:1 into `lib/`. Turn off
    # `very_good_analysis`'s default `always_use_package_imports` so the
    # generated `lib/` imports stay relative. Unlike `example/`, don't
    # enable `prefer_relative_imports` as a tripwire here: `test/`
    # deliberately imports the generated code via `package:integration_tests/...`
    # (it exercises the public, generated `lib/` API, not a same-package
    # sibling), so the rule would flag those intentional imports.
    always_use_package_imports: false
